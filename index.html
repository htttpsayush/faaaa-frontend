<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseAI — Feel Strong. Expressive Wellness &amp; Training.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-page">
  <header class="landing-nav">
    <a href="index.html" class="landing-brand">
      <div class="brand-logo-symbol">
        <svg width="24" height="15" viewBox="0 0 22 14" fill="currentColor">
          <path d="M0 2h6v2H0zm8 0h6v2H8zm8 0h6v2h-6zM3 6h6v2H3zm8 0h6v2h-6zm8 0h3v2h-3zM6 10h6v2H6zm8 0h6v2h-6z"/>
        </svg>
      </div>
      <span class="brand-wordmark">PulseAI</span>
    </a>

    <div class="landing-nav-actions" id="landingNavActions">
      <a href="login.html" class="btn-subtle">Sign In</a>
      <a href="signup.html" class="btn-primary btn-sm">Get Started</a>
    </div>
  </header>

  <main class="landing-hero">
    <section class="landing-hero-copy">
      <h1 class="landing-title">FEEL STRONG</h1>

      <div class="editorial-pills">
        <span class="editorial-pill pill-blush">HOME WORKOUT</span>
        <span class="editorial-pill pill-lime">STRENGTH</span>
        <span class="editorial-pill pill-amber">MUSCLE GAIN</span>
        <span class="editorial-pill pill-lavender">FAT BURN</span>
      </div>

      <div class="landing-cta-row" id="landingCtaRow">
        <a href="signup.html" class="btn-primary">Get Started</a>
        <a href="login.html" class="btn-subtle">Sign In</a>
      </div>
    </section>

    <!-- Expressive Hero Starburst + Overlapping Tilted Metric Pills -->
    <section class="landing-visual-stage hero-starburst-host" aria-label="PulseAI Preview">
      <svg class="hero-starburst-svg" viewBox="0 0 200 200" aria-hidden="true">
        <path fill="#B8E946" d="M100 4 L117 56 L160 22 L144 74 L196 86 L150 112 L188 152 L134 146 L138 196 L100 158 L62 196 L66 146 L12 152 L50 112 L4 86 L56 74 L40 22 L83 56 Z"/>
      </svg>

      <div class="landing-center-card card-capsule">
        <span class="card-label">TODAY'S FOCUS</span>
        <h2 class="card-heading" style="font-size: 2rem; margin-top: 6px;">UPPER BODY</h2>
      </div>

      <span class="tilted-pill pill-blush" data-tilt="-6" style="top: 12px; left: 8px;">540 KCAL</span>
      <span class="tilted-pill pill-amber" data-tilt="4" style="bottom: 18px; left: 14px;">48 MIN</span>
      <span class="tilted-pill pill-forest" data-tilt="-3" style="top: 24px; right: 6px;">COACH CR7</span>
    </section>
  </main>

  <section class="landing-bento-section">
    <div class="landing-bento-grid">
      <div class="bento-card card card-forest card-capsule landing-span-2" style="position: relative; overflow: visible;">
        <span class="tilted-pill pill-lime" data-tilt="5" style="top: -12px; right: 20px;">NEW</span>
        <span class="card-label" style="color: #B8E946;">COACH CR7</span>
        <h2 class="card-heading" style="color: #F6F0E4;">DAILY COACHING</h2>
      </div>

      <div class="bento-card card card-squircle">
        <span class="card-label">NUTRITION</span>
        <h2 class="card-heading">PHOTO LOG</h2>
      </div>

      <div class="bento-card card card-squircle">
        <span class="card-label">WORKOUTS</span>
        <h2 class="card-heading">5 MODES</h2>
      </div>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/motion.js"></script>
  <script>
    (function () {
      const hasToken = Boolean(localStorage.getItem('pulseai_token'));
      if (hasToken) {
        const navActions = document.getElementById('landingNavActions');
        const ctaRow = document.getElementById('landingCtaRow');
        if (navActions) {
          navActions.innerHTML = '<a href="dashboard.html" class="btn-primary btn-sm">Open Dashboard &gt;&gt;&gt;</a>';
        }
        if (ctaRow) {
          ctaRow.innerHTML = '<a href="dashboard.html" class="btn-primary">Continue to Dashboard &gt;&gt;&gt;</a>';
        }
      }
    })();
  </script>
</body>
</html>
